name: clapova-golden

# Suite de non-régression du moteur de rendu Clapova : 10 compositions de
# référence rendues dans l'image Dockerfile.test, comparées par SSIM (>= 0,99
# par frame clé) et par loudness (+/- 0,5 LU). Voir tests/clapova-golden/README.md.

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

concurrency:
  group: clapova-golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Régénérer les références (artefact clapova-golden-references) au lieu de comparer."
        type: boolean
        default: false
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/engine/**"
      - "packages/producer/**"
      - "tests/clapova-golden/**"
      - "Dockerfile.test"
      - ".github/workflows/clapova-golden.yml"
  push:
    branches:
      - main

jobs:
  # Rapide, sans Chrome : générateur, médias ffmpeg, mesures SSIM / loudness.
  selftest:
    name: Suite golden (auto-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg-linux
      - name: Auto-tests de la suite
        run: node --test tests/clapova-golden/golden.test.mjs

  golden:
    name: Rendu et comparaison golden
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build test Docker image (cached)
        timeout-minutes: 20
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: hyperframes-producer:test
          cache-from: type=gha,scope=regression-test-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=regression-test-image' || '' }}

      - name: Rendre les 10 compositions et comparer aux références
        env:
          GOLDEN_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.update && '--update' || '' }}
        run: |
          docker run --rm \
            -e HYPERFRAMES_NO_TELEMETRY=1 \
            --security-opt seccomp=unconfined \
            --shm-size=4g \
            -v "${{ github.workspace }}/tests/clapova-golden:/app/tests/clapova-golden" \
            --entrypoint bash \
            hyperframes-producer:test \
            -c "cd /app && node tests/clapova-golden/run.mjs $GOLDEN_ARGS"

      - name: Upload nouvelles références
        if: github.event_name == 'workflow_dispatch' && inputs.update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clapova-golden-references
          path: tests/clapova-golden/references/
          if-no-files-found: error

      - name: Upload artefacts d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clapova-golden-failures
          path: tests/clapova-golden/failures/
          if-no-files-found: ignore
